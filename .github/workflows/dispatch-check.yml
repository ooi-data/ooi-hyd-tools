name: dispatch-check

# QAQC_dashboard dispatches prefect runs from ci/requirements-dispatch.txt, not the full image.
# Fails if pipeline.py picks up an import that bare env can't satisfy.
on:
  pull_request:
    paths:
      - "ooi_hyd_tools/**.py"
      - "ooi_hyd_tools/config/**"
      - "ci/requirements-dispatch.txt"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -r ci/requirements-dispatch.txt
      - run: .venv/bin/python -m ooi_hyd_tools.pipeline --help
