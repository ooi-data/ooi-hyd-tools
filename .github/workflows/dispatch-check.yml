name: dispatch-check

# QAQC_dashboard dispatches prefect runs from ci/dispatch_env.yml, not the full image.
# Fails if pipeline.py picks up an import that bare env can't satisfy.
on:
  pull_request:
    paths:
      - "ooi_hyd_tools/**.py"
      - "ooi_hyd_tools/config/**"
      - "ci/dispatch_env.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0} # login shell so the conda env is active
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/dispatch_env.yml
          cache-environment: true
      - run: python -m ooi_hyd_tools.pipeline --help
