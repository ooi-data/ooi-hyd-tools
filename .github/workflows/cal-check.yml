name: cal-check

# Fails if a committed cal netCDF no longer matches the YAML spec it was built from,
# catching hand-edited .nc files and specs whose `cal-to-nc build` was never run.
on:
  pull_request:
    paths:
      - "metadata/cal_specs/**"
      - "metadata/cals/**"
      - "ooi_hyd_tools/cal_to_nc.py"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -r ci/requirements-check.txt
      - run: .venv/bin/python -m ooi_hyd_tools.cal_to_nc check metadata/cal_specs/*.yaml
