[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ooi-hyd-tools"
version = "1.7.0"
authors = [{ name="Joe Duprey", email="jduprey@uw.edu" }]
readme = "README.md"
description = "Tools and scripts for working with OOI hydrophone data"
requires-python = ">=3.10,<3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "cftime>=1.6.0",
    "pandas<3.0.0,>=2.0.2",
    "xarray==2023.8.0",
    "fsspec>2024.10.0",
    "s3fs>2024.6.0",
    "numpy<2",
    "soundfile==0.12.1",
    "tqdm>=4.67.1",
    "obspy==1.4.1",
    "loguru>0.6.0",
    "click>=7",
    "matplotlib>3.9",
    "pydantic>2",
    "pyyaml>=6", 
    "prefect<3,>=2.5",
    "netcdf4==1.7.2", # danger! unpinning causes low level dep problems on linux
    "h5py==3.14.0", # danger! unpinning causes low level dep problems on linux
    "polars>1.8",
    "awscli==1.33.44",
    "scipy>=1.10.0",
    "ooipy>=1.2.5",
    # stock pbp reads audio as float64 normalized to full scale; verified bit-identical
    # to the retired jdduprey/pbp@ooi-qaqc int32 fork when paired with VOLTAGE_MULTIPLIER=3
    # and the exact (dB re 1 V/uPa) cal files. 1.8.5 is the version that was verified.
    "mbari-pbp==1.8.5",
]

[project.scripts]
acoustic-pipeline = "ooi_hyd_tools.pipeline:run_acoustic_pipeline"
event-audio = "ooi_hyd_tools.events:extract_event"
cal-to-nc = "ooi_hyd_tools.cal_to_nc:cli"

[tool.hatch.build.targets.wheel]
packages = ["ooi_hyd_tools"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 95
exclude = ["notebooks"]