# Minimal env for `python -m ooi_hyd_tools.pipeline --runner prefect`, which only dispatches
# to the ECS deployment. QAQC_dashboard builds this instead of pulling the full image.
name: ooi-hyd-tools-dispatch
channels:
  - conda-forge
dependencies:
  - python=3.11 # pyproject: >=3.10,<3.12
  - prefect=3.8.6 # matches the image
  - click>=7
  - pyyaml>=6
  - loguru
