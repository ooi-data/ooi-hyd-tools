name: ooi-hyd-tools
prefect-version: 3.8.4

# build section allows you to manage and build docker images
build:

# push section allows you to manage if and how this project is uploaded to remote locations
push:

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/ooi-data/ooi-hyd-tools.git
    branch: main

# the deployments section allows you to provide configuration for deploying flows
deployments:
# pipeline.py sets cpu/memory per run from config/config.yaml and config/obs_config.yaml
- name: hydbb_pipeline
  entrypoint: ./ooi_hyd_tools/mseed_to_audio.py:acoustic_flow_oneday
  parameters: {}
  work_pool:
    name: hydrophone-pool
    job_variables:
      image: public.ecr.aws/p0l4c7i2/ooi-hyd-tools:latest
  schedules: []
